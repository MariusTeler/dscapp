<script>
$(document).ready(function() {
	SetareDate();
	MakeDialog();
	InitConfirmDialog();
	ComboAgenti('curier_livrare');
	Grid_CheltuieliCautareDecont();
});
</script>
<form action="{HTTP}cheltuieli/decont/export" id="export_lista" method="post" name="export_lista">
	<div>
		<fieldset>
			<legend>
				<label class="field_label" for="perioada" onclick="CautareCheltuieliDecont(1);">Perioada</label>
				<input type="checkbox" name="perioada" id="perioada" value="1" class="field_checkbox" onclick="CautareCheltuieliDecont(1);" />
			</legend>
			<div class="field_name" style="width: 101px;">
				<input type="text" name="data_start" id="data_start" class="field_input auto-hint w70" value="" placeholder="De la" disabled="true" />
			</div>
			<div class="field_name" style="width: 101px;">
				<input type="text" name="data_final" id="data_final" class="field_input auto-hint  w70" value="" placeholder="Pana la" disabled="true" />
			</div>
		</fieldset>
		<fieldset style="min-width: 130px;">
			<legend>
				<label class="field_label" for="curier" onclick="CautareCheltuieliDecont(2);">Curier</label>
				<input type="checkbox" name="curier" id="curier" value="1" class="field_checkbox" onclick="CautareCheltuieliDecont(2);" />
			</legend>
			<div class="field_name w130">
				<input type="hidden" name="curier_livrare" id="curier_livrare" value=""/>
				<input type="text" name="curier_livrare_nume" id="curier_livrare_nume" class="field_input auto-hint w120" value="" placeholder="Curier livrare" disabled="true" />
			</div>
		</fieldset>

		<div class="field_name w130 class_btn" style="margin-top: 10px; margin-left: 10px;">
			<input type="button" name="search" class="button" value="Cauta"  onclick="AfisareCheltuieliDecont();" />
			<input type="button" name="export" class="button" value="Export"  onclick="ExportCheltuieliDecont();" />
		</div>
	</div>
</form>

<div class="separator_empty h10">&nbsp;</div>
<table id="jqGrid_decont_cautare_cheltuieli"></table>
<div id="jqGrid_paginatie" class="pagination_jqgrid"></div>
<div class="separator_empty h10">&nbsp;</div>

<div id="eroare" title="Eroare" style="display: none;">
	&nbsp;
</div>

<div id="dialog-form" title="Detalii cheltuiala" style="display:none;width:560px">
	<input type="hidden" name="id" id="id" value=""/>
	<input type="hidden" name="agent_id" id="agent_id" value=""/>
	<div id="modal-error-message" style="color:red;display:none;width:100%;text-align:center">Cheltuiala invalida</div>
	<table width="100%" cellspacing="15">
		<tr>
			<th width="15%" style="text-align:left">Curier</th><td colspan="3"><span id="agent"></span></td>
		</tr>
		<tr>
			<th width="15%" style="text-align:left">Tip</th><td colspan="3"><span id="tip"></span></td>
		</tr>
		<tr>
			<th width="15%" style="text-align:left">Descriere</th><td colspan="3"><span id="descriere"></span></td>
		</tr>
		<tr>
			<th width="15%" style="text-align:left">Suma</th><td width="30%"><span id="suma"></span> LEI</td>	
			<th width="15%" style="text-align:left">Data</th><td width="30%"><span id="data"></span></td>
		</tr>
		<tr>
			<th width="20%" style="text-align:left">Chitanta</th><td width="30%"><span id="chitanta"></span></td>
			<th width="20%" style="text-align:left">Factura</th><td width="30%"><span id="factura"></span></td>
		</tr>
	</table>
	<form></form>
	<div class="separator_empty" style="height: 5px;"></div>
</div>
