<script>
$(document).ready(function() 
{
	Client_Grid_ListeExpeditii();
	ComboLocalitatiClient('{USER_ID}','destinatar_localitate',false);
	ComboClientiClient('{USER_ID}','destinatar', 'destinatar_localitate_id', false);
});
function Cautare(evt){
	var theEvent = evt || window.event;
	var key = theEvent.key || theEvent.which || theEvent.keyCode;
	if(key == 'Enter' || key == 13) 
		ClientAfisareListeExpeditii();
}
</script>

<form action="{HTTP}expeditii/cautare_export/" id="export_lista" method="post" name="export_lista">
	<div class="cautare_expeditii" >
		<fieldset style="min-width: 50px;">
			<legend>
				<label class="field_label" for="operatie">Nr. Exp.</label>
			</legend>
			<div class="field_name w90">
				<input type="text" name="search" id="search" class="field_input auto-hint w80" value="{SEARCH}" title="" onkeydown="return Cautare(event);" />
			</div>
		</fieldset>
		<fieldset>
			<legend>
				<label class="field_label" for="perioada" onclick="CautareExpeditii(1);">Perioada</label>
				<input type="checkbox" name="perioada" id="perioada" value="1" class="field_checkbox" onclick="ClientListeExpeditii(1);" {PERIOADA} />
			</legend>
			<div class="field_name w50" style="line-height: 20px;">
				De la:
			</div>
			<div class="field_name" style="width: 101px;">
				<input type="text" name="data_start" id="data_start" class="field_input auto-hint w70" value="" title="De la" disabled="true" />
			</div>
			<div class="field_name w60" style="line-height: 20px;">
				Pana la:
			</div>
			<div class="field_name" style="width: 101px;">
				<input type="text" name="data_final" id="data_final" class="field_input auto-hint  w70" value="" title="Pana la" disabled="true" />
			</div>
		</fieldset>
		<fieldset>
			<legend>
				<label class="field_label" for="destinatar" onclick="CautareExpeditii(5);">Destinatar</label>
				<input type="checkbox" name="destinatar" id="destinatar" value="1" class="field_checkbox" onclick="ClientListeExpeditii(2);" {DESTINATAR} />
			</legend>
			<div class="field_name w130">
				<input type="text" name="destinatar_localitate" id="destinatar_localitate" class="field_input auto-hint w120" value="" placeholder="Localitate" disabled="true" />
				<input type="hidden" name="destinatar_localitate_id" id="destinatar_localitate_id"/>
			</div>
			<div class="field_name w130">
				<input type="text" name="destinatar_nume" id="destinatar_nume" class="field_input auto-hint w120" value="" placeholder="Client" disabled="true" />
				<input type="hidden" name="destinatar_id" id="destinatar_id"/>
			</div>
		</fieldset>
		<fieldset style="min-width: 50px;">
			<legend>
				<label class="field_label" for="label_platitor" onclick="CautareExpeditii(5);">Platitor</label>
				<input type="checkbox" name="label_platitor" id="label_platitor" value="1" class="field_checkbox" onclick="ClientListeExpeditii(3);" {LABEL_PLATITOR} />
			</legend>
			<div class="field_name w110">
				<select style="width: 100px;" id="platitor" name="platitor" class="field_combobox" disabled="true" >
					<option  selected="selected"  value="1">Expeditor</option>
					<option value="2">Destinatar</option>
				</select>
			</div>
		</fieldset>
		<div class="field_name w130 class_btn" style="margin-top: 15px; margin-left: 10px;">
			<input type="button" name="search" class="button" value="Cauta"  onclick="ClientAfisareListeExpeditii();" />
			<input type="button" name="exporta" class="button" value="Export" onclick="ClientExportExpeditii('liste_expeditii');" />
		</div>
		
	</div>
</form>

<div class="separator_empty h10">&nbsp;</div>
<table id="liste_expeditii"></table>
<div id="paginatie" class="pagination_jqgrid"></div>
<div class="separator_empty h10">&nbsp;</div>

<div id="eroare" title="Eroare" style="display: none;">
	&nbsp;
</div>

<div id="detalii_expeditie" style="display: none;">&nbsp;</div>
