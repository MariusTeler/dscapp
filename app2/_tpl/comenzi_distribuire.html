<script type="text/javascript">
	$(document).ready(function() {
		Grid_ListaComenziDistribuire($('#user_dispecerat').val());
		AgentiDistribuireComenzi();
		IntroducereMesajDistribuire(160);
		MakeDialog();
		$("#collect_at").datepicker({
				changeMonth : true,
				changeYear : false,
				showOn : "both",
				buttonImage : HTTP + "assets/images/calendar.gif",
				buttonImageOnly : true,
				dateFormat : 'dd.mm.yy',
				minDate: 0
			});
	});

</script>
