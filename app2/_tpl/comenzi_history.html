<script type="text/javascript">
	$(document).ready(function() {
		Grid_ListaComenziIstoric($('#user_dispecerat').val());
		MakeDialog();
		$('#data_start').datetimepicker({
			showOn : "button",
			buttonImage : HTTP + "assets/images/calendar.gif",
			buttonImageOnly : true,
			dateFormat : 'dd.mm.yy',
			timeFormat : 'HH:mm',
			hour: 9,
			controlType: 'select',
			oneLine: true,
			onSelect: function (selectedDateTime){
				let start = $(this).datetimepicker('getDate');
				$('#data_final').datetimepicker('option', 'minDate', start );
			},
			onClose: function(dateText, inst) {
				let testStartDate = $(this).datetimepicker('getDate'); 
            	let testEndDate = $('#data_final').datetimepicker('getDate');
				if (testStartDate > testEndDate)
					$("#data_final").datetimepicker('setDate', testStartDate);
			}
		});
		$('#data_final').datetimepicker({
			showOn : "button",
			buttonImage : HTTP + "assets/images/calendar.gif",
			buttonImageOnly : true,
			dateFormat : 'dd.mm.yy',
			timeFormat : 'HH:mm',
			hour: 17,
			controlType: 'select',
			oneLine: true,
			onSelect: function (selectedDateTime){
				let end = $(this).datetimepicker('getDate');
				$('#data_start').datetimepicker('option', 'maxDate', end );
			},
			onClose: function(dateText, inst) {
				let testStartDate = $('#data_start').datetimepicker('getDate');
            	let testEndDate = $(this).datetimepicker('getDate');
				if (testStartDate > testEndDate)
					$("#data_start").datetimepicker('setDate', testEndDate);
			}
		});
		let today = new Date();
		let startDate = new Date(today);
		startDate.setHours(9, 0, 0, 0);
		let endDate = new Date(today);
		endDate.setHours(17, 0, 0, 0);

		$("#data_start").datetimepicker('setDate', startDate);
		$("#data_final").datetimepicker('setDate', endDate);
	});

</script>
