<script type="text/javascript">
	$(document).ready(function() {
		AfisarePerioada_Comenzi();

		ClientiComboLocalitatiOnly('LOC');
	});

<div class="content_left w550">
	<fieldset>

		</div>
		<div class="field_name w60" style="line-height: 20px;">

		</div>

		<div class="field_name w200">
