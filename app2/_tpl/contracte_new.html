<link type="text/css" rel="stylesheet" href="/assets/css/scanport/bootstrap.min.css" >
<link type="text/css" rel="stylesheet" href="/assets/css/scanport/bootstrap-select.min.css" >
<link type="text/css" rel="stylesheet" href="/assets/css/bootstrap-datepicker.min.css" >
<link rel="stylesheet" href="https://unpkg.com/purecss@1.0.0/build/pure-min.css" integrity="sha384-nn4HPE8lTHyVtfCBi5yW9d20FjT8BJwUXyWZT9InLYax14RDjBj46LmSztkmNP9w" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/5.7.0/tinymce.min.js"></script>
<script>tinymce.init({ selector:'textarea', width : "970" });</script>
<style>
    .cod-valid{
        color: green !important;
        font-weight: bold;
    }
    .cod-invalid{
        color: red !important;
    }
    #lista_persoane_contact{
        list-style: none;
    }
    .remove-but{
        line-height: 34px;
        margin: 0 10px;
    }
    .remove-but .glyphicon-minus{
        color: red !important;
    }
    #lista_persoane_contact{
        margin: 10px 0;
    }
    .termen-tip-facturare .dropdown-toggle{
        margin-top: 25px;
        margin-left: 5px;
    }
    .pure-table th{
        text-align: center;
        vertical-align: middle;
    }
    .pure-table th,.pure-table td{
        border: solid #c4c3c7 1px ;
    }
</style>

<form id="formular_contract" action="{HTTP}contracte/nou" method="post" target="_blank">
    <div class="input-group">
        <!--<select id="agent_vanzari" name="agent_id" class="selectpicker" data-live-search="true" style="margin-right: 10px">
            <option value="0">ALEGE AGENT VANZARI</option>
            {AGENTI_VANZARI}
        </select>-->
        <select id="gestionar_contract" name="gestionar_contract" class="selectpicker">
            {GESTIONARI_CONTRACT}
        </select>
        <input name="agent_vanzari" type="text" class="form-control" autocomplete="off" placeholder="Agent vanzari">
    </div>
    <div class="separator_empty h10"></div>
    <div class="w400" style="float:left;">
        <div class="input-group">
            <label>Nr. / data contract</label>
            <div class="clearfix"></div>
            <input name="nr" type="text" class="form-control" autocomplete="off" style="width: 105px;" value="{NR}" id="nr_contract"> <input style="width: 30px" type="text" class="form-control"  disabled="disabled" value="/">  <input name="data" id="data_contract" type="text" class="form-control datepicker" autocomplete="off" style="width: 150px;" value="{DATA}"  data-date-format="dd.mm.yyyy">
        </div>
        <div class="input-group" style="width: 150px;float: left">
            <label>Cod fiscal</label>
            <div class="separator_empty"></div>
            <input id="cod_fiscal" style="width: 135px" name="cod_fiscal" type="text" class="form-control w260" autocomplete="off" value="{COD_FISCAL}">
        </div>
        <div class="input-group" style="width: 200px;float: left">
            <label>Reg.Com</label>
            <div class="separator_empty"></div>
            <input id="reg_com" style="width: 135px" name="reg_com" type="text" class="form-control" autocomplete="off" value="{REG_COM}">
        </div>
        <div class="input-group">
            <label>Nume societate</label>
            <div class="separator_empty"></div>
            <input id="nume_societate" style="width: 285px" name="nume_societate" type="text" class="form-control" autocomplete="off" value="{NUME_SOCIETATE}">
        </div>
        <div class="input-group">
            <label>Localitate</label>
            <div class="separator_empty"></div>
            <input id="localitate" style="width: 285px" name="localitate" type="text" class="form-control" autocomplete="off" value="{LOCALITATE}">
        </div>
    </div>
    <div class="w550" style="float:left;">
        <div class="input-group" style="width: 150px;float: left">
            <label>Banca</label>
            <input name="banca" type="text" class="form-control" autocomplete="off" value="{BANCA}">
        </div>
        <div class="input-group" style="float: right; width: 390px;">
            <label>IBAN</label>
            <input name="iban" type="text" class="form-control" autocomplete="off" value="{IBAN}">
        </div>
        <div style="width: 190px; float: left;display: inline-flex;">
            <div class="input-group">
                <label>Reprezentant</label>
                <input name="reprezentant" type="text" class="form-control" autocomplete="off" value="{REPREZENTANT}">
            </div>
        </div>
        <div style="width: 290px; float: left; margin: 0 10px;display: inline-flex;">
            <div class="input-group">
                <label>C.N.P.</label>
                <div class="separator_empty">&nbsp;</div>
                <input style="width: 130px" name="reprezentant_cnp" type="text" class="form-control" autocomplete="off" value="{REPREZENTANT_CNP}">
            </div>
            <div class="input-group">
                <label>Calitate reprezentant</label>
                <div class="separator_empty">&nbsp;</div>
                <input style="width: 145px"  name="reprezentant_calitate" type="text" class="form-control" autocomplete="off" value="{REPREZENTANT_CALITATE}">
            </div>
        </div>
        <div class="input-group">
            <label>Sediu social</label>
            <input id="sediu_social" name="sediu_social" type="text" class="form-control" autocomplete="off" style="width:550px;" value="{SEDIU_SOCIAL}">
        </div>
        <div class="separator_empty"></div>
        <div class="input-group" style="width: 90px; float: left">
            <label>Zi facturare</label>
            <input name="zi_facturare" type="number" min="1" max="31" class="form-control" autocomplete="off" value="{ZI_FACTURARE}">
        </div>
        <div class="input-group termen-tip-facturare" style="width: 350px;float: left">
            <label>Termen plata (nr. zile)</label>
            <input name="termen_plata" type="number" min="1" required class="form-control" autocomplete="off" value="{TERMEN_PLATA}">
            <select id="tip_facturare" name="tip_facturare" class="selectpicker" data-live-search="true">
                <option value="Lunar">Lunar</option>
                <option value="Bilunar" selected>Bilunar</option>
                <option value="Saptamanal">Saptamanal</option>
                <option value="Manual">Manual</option>
            </select>
        </div>
    </div>
    <div class="separator_empty h10"></div>

    <hr style="border: 1px dotted">

    <div class="input-group">
        <label>Persoane contact</label>
        <div class="separator_empty h10"></div>
        <input id="contact_nume" name="nume" type="text" class="form-control" autocomplete="off" style="width:250px;" placeholder="nume persoana">
        <input id="contact_email" name="email" type="email" class="form-control" autocomplete="off" style="width:250px;" placeholder="email">
        <input id="contact_telefon" name="telefon" type="phone" class="form-control" autocomplete="off" style="width:250px;" placeholder="telefon">
        <input type="button" value="Adauga" class="btn btn-success" onclick="AdaugaContact();">
        <ul id="lista_persoane_contact"></ul>
    </div>
    <hr style="border: 1px dotted"><div class="input-group">
    <label>Puncte de lucru</label>
    <div class="separator_empty h10"></div>
    <input id="pc_nume" name="pc_nume" type="text" class="form-control" autocomplete="off" style="width:250px;" placeholder="denumire punct de lucru">
    <input id="pc_adresa" name="pc_adresa" type="text" class="form-control" autocomplete="off" style="width:250px;" placeholder="adresa">
    <input id="pc_telefon" name="pc_telefon" type="phone" class="form-control" autocomplete="off" style="width:250px;" placeholder="telefon contact">
    <input type="button" value="Adauga" class="btn btn-success" onclick="AdaugaPunctDeLucru();">
    <ul id="lista_puncte_de_lucru"></ul>
</div>
    <hr style="border: 1px dotted">

    <div class="input-group">
        <label>Preturi Servicii</label>
        <div class="separator_empty h10"></div>
        <table class="pure-table"  cellspacing="0" cellpadding="1">
            <tr>
                <th rowspan="2">&nbsp;<br>SERVICII</th>
                <th colspan="2">LOCO<br></th>
                <th colspan="2">ALTE LOCALITATI<br></th>
            </tr>
            <tr>
                <td>Standard</td>
                <td>Propus</td>
                <td>Standard</td>
                <td>Propus</td>
            </tr>
            {TABEL_SERVICII}
        </table>
    </div>

    <hr style="border: 1px dotted">
    <div class="input-group">
        <label>Alte Servicii / Modificari clauze</label>
        <div class="separator_empty h10"></div>
        <textarea name="alte_servicii">{ALTE_SERVICII}</textarea>
    </div>
    <div class="separator_empty h10"></div>
    <div class="input-group">
        <input type="submit" class="btn btn-success" value="Descarca contract">
    </div>
    <div class="separator_empty h10"></div>

</form>

<script type="text/javascript" src="/assets/js/scanport/jquery-1.9.1.js"></script>
<script type="text/javascript" src="/assets/js/scanport/tether.min.js"></script>
<script type="text/javascript" src="/assets/js/scanport/bootstrap.min.js"></script>
<script type="text/javascript" src="/assets/js/bootstrap-select.js"></script>
<script type="text/javascript" src="/assets/js/jquery-migrate-1.0.0.min.js"></script>
<script type="text/javascript" src="/assets/js/jquery-jqgrid/jquery.jqGrid.min.js"></script>
<script type="text/javascript" src="/assets/js/jquery-jqgrid/i18n/grid.locale-ro.js"></script>
<script type="text/javascript" src="/assets/js/bootstrap-datepicker.js"></script>
<script type="text/javascript" src="/assets/js/contracte.js?v={ONLOAD_JS_VERSION}"></script>
