<script type="application/javascript">

    $( document ).ready(function() {
        SetareDate();
        dashboardGrid();
    });

    function SetDashboardCentreData() {
        var id = 'restante_si_rbs';
        $("#"+id).jqGrid('setGridParam', {
            url :HTTP + 'dashboard/json/'+id,
            postData : {
                data_start: $('#data_start').val(),
                data_final: $('#data_final').val()
            },
        }).trigger("reloadGrid");
    }
    function dashboardGrid() {

        var id = 'restante_si_rbs';

        jQuery("#"+id).jqGrid(
            {
                mtype: 'POST',
                datatype : "json",
                colNames : ['COD','Centru','Res. col/liv','Res. col/liv total','RBS netrimise','RBS netrimise val','RBS nelivrate','RBS nelivrate val'],
                colModel : [ {
                    name : 'cod',
                    index : 't.label',
                    align: 'left',
                    width: 50
                },{
                    name : 'lebel',
                    index : 't.nume',
                    align: 'left',
                    width: 200
                }, {
                    name : 'restante_nr',
                    align: 'right',
                    width: 200
                }, {
                    name : 'restante_val',
                    align: 'right',
                    width: 200
                }, {
                    name : 'rbs_netrimise_nr',
                    align: 'right',
                    width: 200
                }, {
                    name : 'rbs_netrimise_val',
                    align: 'right',
                    width: 200
                }, {
                    name : 'rbs_nelivrate_nr',
                    align: 'right',
                    width: 200
                }, {
                    name : 'rbs_nelivrate_val',
                    align: 'right',
                    width: 200
                } ],
                rowNum : 250,
                rowList : [ 250,500],
                width : 970,
                height : 'auto',
                rownumbers : true,
                gridview : true,
                viewrecords : true,
                caption : false, //  caption:label,
                multiselect : false,
                subGrid : false,
                pager : '#paginatie_'+id,
                ondblClickRow : function(id) {
                    window.open(HTTP + 'dashboard/urmarire?centru=' + id + '&data_start=' + $('#data_start').val() + '&data_stop=' + $('#data_final').val(), '_blank');
                },
                footerrow: true,
                userDataOnFooter: true,
                gridComplete: function()
                {
                    $('#box_restante_colectari_livrari').removeClass('disabled-values');
                    var records = $("#"+id).getGridParam("records");
                    $('#'+id+'_count').text(records);
                    $('#restante_total_exp').text(records);

                    var user_data = $("#"+id).getGridParam("userData");
                    $('#restante_total_in_valoare').text(user_data.valoare_totala_expeditie);
                    $('#restante_colectari_exp').text(user_data.count_colectare);
                    $('#restante_colectari_in_valoare').text(user_data.total_colectare_val_exp);

                    $('#restante_livrari_exp').text(user_data.count_livrare);
                    $('#restante_livrari_in_valoare').text(user_data.total_livrare_val_exp);

                    $('#li_restante_colectari_livrari').show();
                    $('#box_restante_colectari_livrari').removeClass('loading_box');

                    $('#restante_colectari_livrari_date_range').text(user_data.restante_colectari_livrari_date_range);

                }

            });

        jQuery("#"+id).jqGrid('navGrid','#paginatie_'+id, {
            del : false,
            add : false,
            edit : false,
            search : true
        },{},{},{},{multipleSearch:true});

        jQuery("#"+id).jqGrid('navButtonAdd','#paginatie_'+id,{
            caption:"Export to CSV",
            onClickButton : function () {
                window.location.href = HTTP + 'dashboard/export_csv/'+id+'?data_start='+$('#data_start').val()+ '&data_final=' +$('#data_final').val();
            }
        });

        jQuery("#"+id).jqGrid('bindKeys');
        jQuery("#"+id).jqGrid('filterToolbar',{
            stringResult : true,
            searchOnEnter : false
        });

    }
</script>
