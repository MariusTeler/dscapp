	function ModificaClientExpeditii(id) {
		var acction = $('#select_acction_'+id).val();

		if(acction == 'Alege'){
			AfiseazaEroare("Selectioneaza o actiune !");
		}


		var row_id = id;
		var el_id = 'liste_expeditii_clienti_'+id+'_t';
		var grid = $('#'+el_id);
		if(!grid.length) {
			AfiseazaEroare("Deschide lista si selectioneaza minimum o expeditie !");
			return false;
		}
		var sel_ids = grid.jqGrid('getGridParam', 'selarrrow');
		if(sel_ids.length==0) { AfiseazaEroare("Selectioneaza minimum o expeditie !"); return false; }
		if(sel_ids.length > 300) { AfiseazaEroare("Borderoul este limitat la maximum 300 de expeditii !"); return false; }
		var postData = {};

		for(var $i=0, $l=sel_ids.length; $i<$l; $i++) postData[$i] = sel_ids[$i];
		var postData = JSON.stringify(postData);

		ModificaExpeditiiClient(postData,acction,el_id,row_id);

		//console.log(postData);
	}

	function AfiseazaEroare(mesaj, title, height, width) {
		if (!height)
			height = 200;
		if (!width)
			width = 300;
		$("#eroare").html(mesaj);
		if (!title)
			title = 'Eroare'
		$("#eroare").attr('title', title);
		$("#eroare").dialog({
			modal : true,
			draggable : false,
			height : height,
			width : width,
			resizable : false,
			buttons : {
				Ok : function() {
					$(this).dialog("destroy");
				}
			}
		});
	}

	function ModificaExpeditiiClient(exp,type,el_id,row_id){
		if (typeof exp === "undefined") {
			return false;
		}

		$('#confirmare_expeditie').html('<p>Doriti sa modificati expeditiile?</p>');
		$("#confirmare_expeditie").dialog("destroy");
		$("#confirmare_expeditie").dialog({
			width : 300,
			height : 160,
			draggable : false,
			resizable : false,
			modal: true,
			buttons: {
				"DA": function() {
					$(this).dialog("close");
					$.post(HTTP + 'expeditiiclienti/modifica_expeditii/'+type,{
						data: exp,
					}, function(response) {
						var m_delete = response.split('|||');
						PrepareResponse(m_delete[0]);
						if (m_delete[0] == 1) {
							// $('#form_expeditie')[0].reset();
							$("#"+el_id).jqGrid('setGridParam', {
								url : HTTP + 'expeditiiclienti/json/liste_expeditii_clienti/'+row_id
							}).trigger("reloadGrid");
						} else {
							AfiseazaEroare(m_delete[1]);
						}
						return true;
					});
				},
				'Nu': function() {
					$(this).dialog("close");
				}
			},
			close : function() {
				$(this).dialog("destroy");
			}
		});
	}


	function ModificaExpeditieClient(exp,type){
		if (typeof exp === "undefined") {

		var postData = {};

					$.post(HTTP + 'expeditiiclienti/modifica_expeditii/'+type,{

					}, function(response) {
						var m_delete = response.split('|||');

						if (m_delete[0] == 1) {

					});

				}
			},
			close : function() {
				$(this).dialog("destroy");
			}
		});
	}
