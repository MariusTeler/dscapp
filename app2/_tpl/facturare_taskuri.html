    function ComboClientiFacturareNoua(field) {
        $("#" + field + "_nume").autocomplete({
            source : function(request, response) {
                $.ajax({
                    url : HTTP + "facturare/json/platitori",
                    dataType : "json",
                    data : { name_startsWith : request.term , puncte_de_lucru: $('#puncte_de_lucru').is(':checked'), clienti_activi: $('#clienti_activi').is(':checked'), clienti_cash: $('#clienti_cash').is(':checked') },
                    success : function(data) {
                        response($.map(data.rezultat, function(item) {
                            return {
                                cod_cl : item.cod_cl,
                                master : item.master,
                                localitate_id : item.localitate_id,
                                cod_fiscal : item.cod_fiscal,
                                NUME_SOCIETATE : item.NUME_SOCIETATE,
                                REG_COM : item.REG_COM,
                                LOCALITATE_SEDIU_SOCIAL : item.LOCALITATE_SEDIU_SOCIAL,
                                ADRESA_SEDIU_SOCIAL : item.ADRESA_SEDIU_SOCIAL,
                                EMAIL_FACTURA : item.EMAIL_FACTURA,
                                value : item.value,
                                label : item.label,
                            }
                        }));
                    }

                });
            },
            minLength : 2,
            select: function(event,ui){
                $('#'+field).val(ui.item.cod_cl);
                $('#'+field+"_master").val(ui.item.master);
                var dethtml = '';
                dethtml += '<span>COD CL:</span>' + ui.item.cod_cl + '<br>';
                dethtml += '<span>Cod fiscal:</span>' + ui.item.cod_fiscal + '<br>';
                dethtml += '<span>Reg. Com.:</span>' + ui.item.REG_COM + '<br>';
                dethtml += '<span>Nume Societate:</span>' + ui.item.NUME_SOCIETATE + '<br>';
                dethtml += '<span>Localitate sediu:</span>' + ui.item.LOCALITATE_SEDIU_SOCIAL + '<br>';
                dethtml += '<span>Adresa sediu:</span>' + ui.item.ADRESA_SEDIU_SOCIAL + '<br>';
                dethtml += '<span>Email factura:</span>' + ui.item.EMAIL_FACTURA + '<br>';


                $('#detalii_client_selectat').html(dethtml);

                //  $('#localitate_id').val(ui.item.localitate_id);
                //  $('#'+field+"_nume").val(ui.item.value);
                //  $('#'+field+"_afm").val(ui.item.cod_fiscal);
            },
            open: function() {
                $('#'+field).val("");
                $('#'+field+"_master").val("");
                //  $('#'+field+"_afm").val("");
                $(this).removeClass("ui-corner-all").addClass("ui-corner-top");

            }

    function sortTabs(target) {
        var sortedTabs = $(target).find("li").sort(function (a, b) {
            if (a.id < b.id) {
                return -1;
            } else {
                return 1;
            }
        });
        //update the sorted DOM
        $(target).find('ul').html(sortedTabs);
    }

    function adaugaInFacturare() {
        var grid = jQuery('#detalii_task');
        var sel_ids = grid.jqGrid('getGridParam', 'selarrrow');
        if(sel_ids.length==0) { AfiseazaEroare("Selectioneaza minimum o expeditie!"); return false; }
        $('#adauga_in_facturare').attr('disabled','disabled');
        $("#detalii_task").closest(".ui-jqgrid").find('.loading').show();
        var ajaxPost = $.ajax({
            type: "POST",
            url : HTTP + 'facturare/acc',
            dataType : "json",
            data : { adauga : sel_ids ,proforma_activa :proforma_activa },
            cache: false,
            success : function(data) {
                jQuery("#detalii_task").jqGrid('setGridParam', {
                    url : HTTP + 'facturare/json/detalii_task/'+ proforma_activa,
                }).trigger("reloadGrid");
                if(data.eroare == 1){
                    AfiseazaEroare(data.mesaj);
                }
                // console.log(data);
            }
        });

        ajaxPost.always(function() {
            $('#adauga_in_facturare').removeAttr('disabled');
            $('#expeditii_spre_facturare').click();
            $("#detalii_task").closest(".ui-jqgrid").find('.loading').hide();
        });
    }

        window.open(url,'_blank');
        return true;
    }

        var expeditii = $('#lista_storno_cautare').val().replace(/[\r\n\s\t\v\u0085\u2028\u2029]+/g, ',');

        // console.log(expeditii);
        jQuery("#detalii_task").jqGrid('setGridParam', {
            url : HTTP + 'facturare/json/detalii_task/'+proforma_activa + proforma_activa_detalii_tip,
            postData : {
                expeditii_stornare:expeditii,
                filters:'{"groupOp":"AND","rules":[{"field":"ep.data_expeditie","op":"gt","data":""},{"field":"ep.data_expeditie","op":"lt","data":""}]}'
            },
            search : false
        }).trigger("reloadGrid");
    }

    function generareSpecificatieNoua() {

        if(parseInt($('#clienti_combo').val()) > 0){
            var data_start = '';
            var data_final = '';
            var master = $('#clienti_combo_master').val();
            var task_nou_tip = parseInt($('#task_nou_tip').val());
            var expeditii = $('#expeditii_task_nou').val().replace(/[\r\n\s\t\v\u0085\u2028\u2029]+/g, ',');

            if ($('#perioada').is(':checked')) {
                data_start = $('#data_start').val();
                data_final = $('#data_final').val();
            }
            
            if(task_nou_tip == 2 && expeditii.length==0){
            	AfiseazaEroare("Introduceti minimum o expeditie pentru Storno !");
            	return false;
            }

            $.ajax({
                type: "POST",
                url : HTTP + 'facturare/acc',
                dataType : "json",
                data : {generare: $('#clienti_combo').val() , data_start:data_start, data_final:data_final, sterge:0, expeditii_task_nou:expeditii, task_nou_tip: 1, master: master },
                cache: false,
                success : function(data) {
                    jQuery("#lista_taskuri").jqGrid('setGridParam', {
                        url : HTTP + 'facturare/json/taskuri/'+facturare_task_menu,
                    }).trigger("reloadGrid");
                    if(data.eroare == 1){
                        AfiseazaEroare(data.mesaj);
                    } else {
                        // $('#clienti_combo').val(0);
                        // $('#clienti_combo_nume').val("");
                        $('#facturare-tabs').tabs('select', 0);
                    }
                },
                error: function(xhr, status, error) {
                    AfiseazaEroare('<strong>'+status+'</strong><br>'+xhr.responseText);
                }
            });

            /*jQuery("#lista_taskuri").jqGrid('setGridParam', {
             url : HTTP + 'facturare/json/taskuri/'+facturare_task_menu,
             postData:{generare: $('#clienti_combo').val() , data_start:data_start, data_final:data_final, sterge:0}
             }).trigger("reloadGrid");*/
            // resetPostData('lista_taskuri');

        } else {
            AfiseazaEroare("Selectioneaza minimum un client pentru generare!");
        }

    }

    function modificare_data_facturi() {
        var grid = jQuery('#lista_taskuri');
        var sel_ids = grid.jqGrid('getGridParam', 'selarrrow');
        if(sel_ids.length==0) { AfiseazaEroare("Selectioneaza minimum o preforma pentru a modifica!"); return false; }

        $.ajax({
            type: "POST",
            url : HTTP + 'facturare/acc',
            dataType : "json",
            data : { modificare_data: sel_ids, data_noua: $('#data_facturi_val').val()},
            cache: false,
            success : function(data) {
                jQuery("#lista_taskuri").jqGrid('setGridParam', {
                    url : HTTP + 'facturare/json/taskuri/'+facturare_task_menu,
                }).trigger("reloadGrid");
                if(data.eroare == 1){
                    AfiseazaEroare(data.mesaj);
                }
            }
        });

    }

    function CautarePerioadaFacturaExpeditii() {
        if ($('#perioada_cautare').is(':checked')) {
            $('#data_start_cautare').removeAttr('disabled');
            $('#data_final_cautare').removeAttr('disabled');
            $('.ui-datepicker-trigger').show();
        } else if ($('#perioada').is(':checked')) {
            $('#data_start').removeAttr('disabled');
            $('#data_final').removeAttr('disabled');
            $('.ui-datepicker-trigger').show();
        }
        else {
            $('#data_start_cautare').attr('disabled', true);
            $('#data_final_cautare').attr('disabled', true);
            $('#data_start').attr('disabled', true);
            $('#data_final').attr('disabled', true);
            $('.ui-datepicker-trigger').hide();
        }
    }


    function generareSpecificatii() {

        var lunare      = $("#lunare ").is(':checked');
        var bilunare    = $("#bilunare ").is(':checked');
        var saptamanale = $("#saptamanale ").is(':checked');

        $.ajax({
            type: "POST",
            url : HTTP + 'facturare/acc',
            dataType : "json",
            data : {genereazaSpecificatii: 1, lunare:lunare, bilunare:bilunare, saptamanale:saptamanale },
            cache: false,
            success : function(data) {
                if(data.eroare == 1){
                    AfiseazaEroare(data.mesaj);
                } else {
                    $('#lunare').attr('checked', false);
                    $('#bilunare').attr('checked', false);
                    $('#saptamanale').attr('checked', false);
                    AfiseazaEroare("Success !");
                }
            }
        });
    }


    function resetareWmeCom(idTabel) {
        var grid = jQuery('#'+idTabel);
        var sel_ids = grid.jqGrid('getGridParam', 'selarrrow');
        if(sel_ids.length==0) { AfiseazaEroare("Selectioneaza minimum o factura, pentru a trimite catre wme!"); return false; }
        $.ajax({
            type: "POST",
            url : HTTP + 'facturare/acc',
            dataType : "json",
            data : { resetare_wme_com: sel_ids },
            cache: false,
            success : function(data) {
                $('#cautare_acc').click();
                if(data.eroare == 1){
                    AfiseazaEroare(data.mesaj);
                }
            }
        });
    }
