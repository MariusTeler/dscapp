<form action="{HTTP}facturi/export_restante_expeditii/" id="export_lista" method="post" name="export_lista">

		<fieldset>
			<legend>
				<label class="field_label">Selectie</label>
			</legend>
			<div class="field_name w50" style="line-height: 20px;">
				De la:
			</div>
			<div class="field_name" style="width: 101px;">
				<input type="text" name="data_start" id="data_start" class="field_input  w70" value="{DATA_START}" title="De la" />
			</div>
			<div class="field_name w60" style="line-height: 20px;">
				Pana la:
			</div>

			</div>
			<div class="field_name w80" style="line-height: 20px;">

			</div>
			<div class="field_name w200">
				{CENTRU}
			</div>
		</fieldset>
		<div class="field_name w300 class_btn" style="margin-top: 15px; margin-left: 40px;">
        	<input type="button" name="search" class="button" value="Afiseaza"  onclick="AfisareRestante();" />
	        <input type="submit" name="export" class="button ascuns" value="Export" />
	    </div>
