<script type="text/javascript">
	$(document).ready(function() {
		Grid_Facturi_Decont();
	});

	function AfisareFacturiDecont(){
		var lines = $('#facturi_area').val().split(new RegExp(/[\r\n\x0B\x0C\u0085\u2028\u2029]+/g)).filter(function (el) {
  			return el != null && el != "";
		});
		$('#text_lines').html(lines.length);
	    var facturi = $('#facturi_area').val().replace(/[\r\n\x0B\x0C\u0085\u2028\u2029]+/g, ',');
		var testFacturi = $('#facturi_area').val().replace(/[\r\n\x0B\x0C\u0085\u2028\u2029,]+/g, '');
		if(!testFacturi.trim()) { AfiseazaEroare("Introdu minim o factura !"); return false; }
		jQuery("#validare_facturi").jqGrid('setGridParam',{postData: { facturi: facturi }}).trigger("reloadGrid");
	}

	function Grid_Facturi_Decont(){
		var grid = jQuery('#validare_facturi');
		grid.jqGrid(
		{
			url : HTTP + 'facturi/json/v_incasari',
			datatype: 'json',
			mtype: 'POST',
			colNames : [ 'Data facturare', 'Factura', 'Chitanta', 'Suma', 'Centru', 'Agent', 'Expeditii','Anulata'],
			colModel : [
			{
				name : 'trndate',
				search:false,
				index : 'df.data',
				sorttype : 'date',
				formatter : 'date',
				formatoptions : {
					srcformat : 'Y-m-d',
					newformat : 'd.m.Y'
				},
				width: 80,
				align: 'center'
			}, {
				name : 'factura',
				index : 'df.serie',
				width: 120
			}, {
				name : 'chitanta',
				search:false,
				index : 'df.serie',
				width: 120
			},{
				name : 'suma',
				index : 'df.suma',
				search:false,
				formatter: 'number', 
				sorttype: 'number', 
				align: 'right',
				width: 70,
				formatter:"number" 
			},{
				name : 'centru',
				index : 'c.nume',
				width: 80,
				align: 'center'
			},{
				name : 'agent',
				index : 'ag.nume_ag',
				width: 80
			},{
				name : 'expeditii',
				search:false,
				sortable : false,
				width: 330
			},{
				name : 'anulata',
				search:false,
				sortable : false,
				hidden:true
			}],
			rownumbers : true,
			scroll : 1,
			rowNum : 100,
			width : 970,
			height : 295,
			sortname : 'df.anulata',
			sortorder : "desc",
			viewrecords : true,
			shrinkToFit: false,
			caption:'Lista facturi',
			forceFit: true,
			multiselect: true,
			footerrow: true,
	    	userDataOnFooter: true,
			rowattr: function (rowData, rowObject) {
				if(rowData.anulata != 0) {
					return { "class" : "myAltRowClass"};
				}
			},
			loadComplete: function(data) {
				if (data.rows && data.rows.length > 0) {
        			for (var i = 0; i < data.rows.length; i++) {
            			if (data.rows[i].cell[7] != '0') {
							$("#jqg_validare_facturi_" + data.rows[i].id).attr("disabled", "disabled");
            			}
        			}
    			}
			},
			beforeSelectRow: function(rowid, e) {
				var cbsdis = $("tr#"+rowid+".jqgrow > td > input.cbox:disabled", grid[0]);
				if (cbsdis.length === 0) {
					return true;    // allow select the row
				} else {
					return false;   // not allow select the row
				}
			},
			onSelectAll: function(aRowids,status) {
				if (status) {
					// uncheck "protected" rows
					var cbs = $("tr.jqgrow > td > input.cbox:disabled", grid[0]);
					cbs.removeAttr("checked");

					//modify the selarrrow parameter
					grid[0].p.selarrrow = grid.find("tr.jqgrow:has(td > input.cbox:checked)")
						.map(function() { return this.id; }) // convert to set of ids
						.get(); // convert to instance of Array
				}
        	}
		})
		.jqGrid('bindKeys')
		.jqGrid('filterToolbar',{
			stringResult : true,
			searchOnEnter : false
		});
	}

	function ValidareFacturiDecont() {

		var vf_grid = jQuery('#validare_facturi');
		var sel_ids = vf_grid.jqGrid('getGridParam', 'selarrrow');
		if(sel_ids.length==0) { AfiseazaEroare("Selectioneaza minimum o factura !"); return false; }
		else if(sel_ids.length>300) { AfiseazaEroare("Nu se pot selectiona mai mult de 300 de facturi !"); return false; }
		var postData = {};

		for(var $i=0, $l=sel_ids.length; $i<$l; $i++) postData[$i] = sel_ids[$i];
		var postData = JSON.stringify(postData);

		var url = HTTP + 'facturi/v_incasari_validare';
		$.post(url, { facturi: postData }, function(response) {
			var rasp = response.split('|||');
			if(response == 0) { AfiseazaEroare(response+" Erori la validare ... anunta IT-ul"); return false; };
			if(rasp[0] == 2) { AfiseazaEroare(rasp[1]); return false; }
			AfisareFacturiDecont();
		});
	}

</script>
<div class="v_facturi" >
	<fieldset style="min-width: 690px;">
		<legend>
			<label class="field_label">Actiuni (<span id="text_lines">0</span> facturi)</label>
		</legend>
		<div class="field_name w320">
			<input type="button" name="afisare_note" class="button" value="Afisare" onclick="AfisareFacturiDecont();"/>
		</div>
	</fieldset>
	<div class="field_name w70 class_btn" style="margin-top: 10px; margin-left: 10px;">
		<input type="button" name="plateste" class="button" value="Valideaza"  onclick="return ValidareFacturiDecont();" />
	</div>
	<div class="separator_empty h5">&nbsp;</div>
	<textarea id="facturi_area" name="facturi_area" style="width:100%" rows="10" placeholder="Facturi separate cu , sau Enter"></textarea>
</div>
<div class="separator_empty" style="height: 2px;"></div>
<table id="validare_facturi"></table>
<div class="separator_empty h5">&nbsp;</div>
<div id="eroare" title="Eroare" style="display: none;"></div>
<div id="mesaj_confirmare" title="Confirmare" style="display: none;">
	Sunteti sigur?
</div>
