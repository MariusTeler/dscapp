		<div class="field_name w70" style="padding-top: 12px; padding-left: 20px;">
			Fisier XLS
		</div>

			<input type="file" accept=".xls" name="fxls" class="field_input"/>

		<div class="field_name w80" style="padding-top: 5px;">
			<input type="submit" name="sxls" class="button" value="Verificare" title="Verificare" style="margin-left: 10px;"/>

</div>
