<script type="text/javascript">
	$(document).ready(function() {
		SetareDate();
	});

    function Export(tip){
		var data_start = encodeURIComponent($('#data_start').val());
		var data_final = encodeURIComponent($('#data_final').val());

		var cond = '&tip=' +tip + '&data_start=' + data_start + '&data_final='+ data_final

		var status_ramburs = parseInt($('#status_ramburs').val());
		if(!isNaN(status_ramburs) && status_ramburs >= 0)
			cond += '&status_ramburs=' + status_ramburs;

		$.download('reports/export', cond, false);
	}
</script>
