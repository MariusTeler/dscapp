<h3>Lista borderouri:</h3>

<table id="borderouri_livrare_curieri"></table>
<div id="eroare" title="Eroare" style="display: none;"></div>

<script type="text/javascript">
    function ComboBoLivrareCurieri(field) {
            $("#"+field+"_nume").autocomplete({
                source : function(request, response) {
                    var centru = parseInt($('#centru').val());
                    $.ajax({
                        type: "GET",
                        url : HTTP + "agenti/autocomplete",
                        dataType : "json",
                        data : 'maxRows='+8+'&name_startsWith='+request.term+'&centru='+centru,
                        success : function(data) {
                            response($.map(data.rezultat, function(item) {
                                return {
                                    id : item.id,
                                    label : item.label,
                                    value : item.value
                                }
                            }));
                        }
                    });
                },
                minLength : 1,
                select : function(event, ui) {
                    $("#" + field).val(ui.item.id);
                    $("#" + field + "_nume").val(ui.item.value);
                },
                open : function(event, ui) {
                    $("#" + field).val("");
                },
                change : function(event, ui) {
                    if($("#" + field + "_nume").val() == '')
                    {
                        $("#" + field).val("");
                    }
                },
                close : function() {
                    $(this).removeClass("ui-corner-top").addClass("ui-corner-all");
                }
            });
        }
	$(document).ready(function() {
        AfisareDataOnly();
        ComboBoLivrareCurieri('agent');
		Grid_BoLivrareCurieri();
	});
</script>
