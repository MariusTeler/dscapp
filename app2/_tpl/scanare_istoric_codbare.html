<script type="text/javascript">
	$(document).ready(function() {

	function VerificareAfisare(evt){
    	var theEvent = evt || window.event;
    	var key = theEvent.key || theEvent.which || theEvent.keyCode;
    	if(key == 'Enter' || key == 13) AfisareIstoricCodBare();
    }
</script>
	<div style="padding:0px 0px 2px 0px;" class="cautare_expeditii" >

			<div class="field_name w200">
				<input type="text" name="codbare" id="codbare" class="field_input  w190" style="padding: 6px;" value="" title="Cod Bare" onkeydown="VerificareAfisare(event);"/>
			</div>			
			<div class="field_name w200">
				<input type="button" name="go" id="go" class="button" value="Afisare" title="Afisare Istoric" style="margin-left: 10px;" onclick="AfisareIstoricCodBare();" />
