<!DOCTYPE html>
<html lang="en">
	<head>
		<style type="text/css">
			* {
				margin: 0px;
				padding: 0px;
			}
			html {
				background: white;
			}
			.A4 {
				width: 210mm;
				margin: 0 auto;
			}
			body {
				font-size: 12pt;
				font-family: Helvetica;
			}
			.ascuns{
				display: none;
			}
			table{
				padding: 0px;
				margin: 0px;	
				width: 100%;
			}
			tr{
				padding: 0px;
				margin: 0px;
			}
			td{
				height: 25pt;
			}
			.h_d{height: 50pt;}
			.border{
				border: 1px solid #000;				
			}
			.b_l{
				border-left: 1px solid #000;
			}
			.b_r{
				border-right: 1px solid #000;
			}
			.b_t{
				border-top: 1px solid #000;
			}
			.b_b{
				border-bottom: 1px solid #000;
			}
			
			div span{
				padding-left:5px;
				display: block;
			}
			.top{
				font-weight: bold !important;
				font-size: 16pt;
				padding-bottom: 0mm;
			}
			.header{
				font-weight: bold !important;
				font-size: 7pt;
			}
			.content{
				font-size: 9pt;
				font-weight: normal;
				min-height: 10mm;
			}
			
			@page
			{
				size: portrait;
				margin: 0.3cm;
			}
			@media all {
				.page-break	{ display: none; }
			}
			
			@media print {
				.page-break	{ display: block; page-break-before: always; }
			}
			
		</style>
	</head>
	<body>
		<div class="A4">
			
			<table class="top" cellpadding="0" cellspacing="0">
				<tr>
					<td>BORDEROU IESIRE RUTA NR: {BORDEROU}</td>
					<td>DATA: {DATA}</td>
					<td>RUTA: {RUTA}</td>
				</tr>
			</table>
			
			<div style="height: 1mm; width: 100%;"></div>
			
			<table class="header border" cellpadding="0" cellspacing="0" width="100%">
				<tr>
					<td style="width: 8mm; line-height: 5mm; height: 5mm; text-align: center; font-size: 11pt;" class="">Crt</td>
					<td style="width: 25mm; line-height: 5mm; height: 5mm; text-align: left; font-size: 11pt;" class="">Nr AWB</td>
					<td style="width: 15mm; line-height: 5mm; height: 5mm; text-align: center; font-size: 11pt;" class="">Tip</td>
					<td style="width: 50mm; line-height: 5mm; height: 5mm; text-align: left; font-size: 11pt;" class="">Expeditor</td>
					<td style="width: 30mm; line-height: 5mm; height: 5mm; text-align: left; font-size: 11pt;" class="">Localitate</td>
					<td style="width: 50mm; line-height: 5mm; height: 5mm; text-align: left; font-size: 11pt;" class="">Destinatar</td>
					<td style="width: 30mm; line-height: 5mm; height: 5mm; text-align: left; font-size: 11pt;" >Localitate</td>
				</tr>
			</table>
			{ITEMS}
			<div style="width: 60%; float:left;">Total: <strong>{TOTAL_EXPEDITII} expeditii</strong> / <strong>{TOTAL_PIESE} piese</strong> / <strong>{TOTAL_GREUTATE} kg</strong> / <strong>{TOTAL_VALOARE_ASIGURATA} LEI</strong></div>
			<div style="width: 40%; float:right; text-align: right;">Pagina <strong>{TOTAL}</strong> din <strong>{TOTAL}</strong></div>
		</div>
	</body>
