<div class="content_login expirare_{AFISARE_EXPIRARE}">
    <form id="formular" name="formular" action="" method="post" onsubmit="">
        <div class="field_row" style="text-align:center;">
                <img src="/assets/images/logo.png">
        </div>
        <div class="separator_empty h10"></div>
        <div class="field_row">{LOGIN_ERROR}</div>
        <div style="display: {AFISARE_EXPIRARE};">
            <div class="field_row">
                <label><strong>Utilizator</strong></label>
                <div class="separator_empty"></div>
            </div>
        </div>
        <div class="field_row">
            <input type="text" class="text_field" name="login_user" id="login_user" value="" placeholder="Username"/>
            <div class="separator_empty"></div>
        </div>
        <div style="display: {AFISARE_EXPIRARE};">
            <div class="field_row">
                <label><strong>Parola veche</strong></label>
                <div class="separator_empty"></div>
            </div>
        </div>
        <div class="field_row">
            <input type="password" class="text_field" id="login_pass" name="login_pass" value="" placeholder="Password"/>
            <div class="separator_empty"></div>
        </div>
        <div class="separator_empty"></div>
        <div style="display: {AFISARE_EXPIRARE};">
            <div class="field_row">
                <label><strong>Parola noua</strong></label>
                <div class="separator_empty"></div>
            </div>
            <div class="field_row">
                <input type="password" class="text_field" name="login_pass_new" value="" placeholder=""/>
                <div class="separator_empty"></div>
            </div>
            <div class="field_row">
                <label><strong>Verificare parola noua</strong></label>
                <div class="separator_empty"></div>
            </div>
            <div class="field_row">
                <input type="password" class="text_field" name="login_pass_new_verify" value="" placeholder=""/>
                <div class="separator_empty"></div>
            </div>
        </div>


        <div class="separator_empty"></div>
        <div class="field_row">       
            <input type="submit" class="button" value="Intra in Cont"  style="float: right !important"/>        
        </div>
        <div class="separator_empty h5"></div>  
    </form>
</div>
<script>
    function ready(callback){
        // in case the document is already rendered
        if (document.readyState!='loading') callback();
        // modern browsers
        else if (document.addEventListener) document.addEventListener('DOMContentLoaded', callback);
        // IE <= 8
        else document.attachEvent('onreadystatechange', function(){
            if (document.readyState=='complete') callback();
        });
    }

    ready(function() {
        var login_user = document.getElementById("login_user");
        var login_pass = document.getElementById("login_pass");
        var login_form = document.getElementById("formular");
        document.onkeydown = function( event ) {
            if ( event.which == 13 && login_user.value.length  > 0 && login_pass.value.length  > 0) {
                login_form.submit();
            }
        };
    });
</script>
