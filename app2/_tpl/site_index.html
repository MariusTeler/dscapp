<!DOCTYPE html>
<html lang="ro">
    <head>
        <meta http-equiv="Content-type" content="text/html;charset=UTF-8" />        
        <meta name="title" content="Dragon Star Curier"/>
        <title>Dragon Star Curier</title>

        <style>
            *{margin:0px;padding:0px;}
            form {
                margin: 0px;
                padding: 0px;
            }

            body {
                background: #e1e1e1 url('/assets/images/body_bg.png') top left repeat;
                font-size: 12px;
                font-style: normal;
                font-family: "Trebuchet MS","Verdana","Arial";
                color: #232222;
                line-height: normal;
            }

            .main{   
                width: 990px;    
                margin: 0px auto;
            }

            .content_login {
                background: url('/assets/images/bg2.png') repeat-x scroll 0 0 #e5e5e5;
                width:260px;
                box-shadow: 0px 0px 15px 0px #111111;
                border-radius: 5px;
                border: 1px solid #ccc;
                margin: 200px auto 0px;
                padding: 25px;
                padding-bottom: 5px;
            }

            .content_login.expirare_block{
                margin: 100px auto 0;
            }

            .separator_empty {
                clear:both;
                background: none;
                height: 0px;
                font-size:0px;
                line-height: 0px;
                width: 100%;
                margin:0px;
                padding: 0px;
                _margin-top: -2px;
            }

            .field_row {
                clear: both;
                padding-bottom: 10px;
            }

            .text_field {
                float: left;
                font-size: 14px;
                margin: 3px 0px;
                padding:4px;
                color: #232222;
                width: 250px;
                border: 1px solid #4a4a4a;
                border-radius:4px; 
                box-shadow: 0px 1px 5px 0px #4a4a4a;
            }
            .text_field_over {
                border: 1px solid #eb5a5a;
            }
            .text_field_error {    
                border: 1px solid #eb5a5a;
            }
            .button {
                float: left !important;
                font-size: 12px !important;
                padding: 5px !important;
            }
            .h10 {height: 10px;}
            .h5 {height: 5px;}

            .warning{
                background-image:url(/symbol_enable.gif);
                background-repeat:no-repeat;
                background-position:15px 8px;
                font-family:Arial, Helvetica, sans-serif;
                font-size:12px;
                font-weight:bold;
                color: #e9c20b;
                padding: 10px 0px 10px 35px;
                background-color: #f5f3cd;
                border:1px solid #eef012;
            }

            .error
            {
                background-image:url('/assets/images/symbol_error.png');
                background-repeat:no-repeat;
                background-position:15px 4px;
                font-family:Arial, Helvetica, sans-serif;
                font-size:12px;
                font-weight:bold;
                color: #990000;
                padding: 10px 0px 10px 35px;
                background-color: #F5DEE0;
                border:1px solid #990000;
            }
        </style>
    </head>
    <body>
        <div class="main">
            {CONTENT}
        </div>
        <div id="footer" style="text-align:center;">
            {FOOTER_TEXT}
        </div>
    </body>
</html>
